name: Website and p2 update site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Build, Release p2 and server distributions]
    types: [completed]
  release:
    types: [edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole rebuild/deployment so an older snapshot cannot replace it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name != 'Build' ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         github.event.workflow_run.head_repository.full_name == github.repository)))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      # Always use the trusted default branch, including workflow_run events.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build existing project website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add verified release repositories and update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jekyll's Docker action writes root-owned output.
          sudo chown -R "$(id -u):$(id -g)" _site
          python3 scripts/p2_release.py site --repo "$GITHUB_REPOSITORY" --output _site --include-testing

      - name: Upload website and p2 repositories
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
