name: Website and p2 update site

on:
  workflow_run:
    workflows: [Build, Server containers, Release p2 and server distributions, Release Synology distribution]
    types: [completed]
  release:
    types: [edited, deleted]
  workflow_dispatch:
    inputs:
      maintenance_only:
        description: Clean Pages history and retired temporary container versions without deploying
        type: boolean
        default: false
      apply_cleanup:
        description: Apply the reviewed maintenance deletion plan
        type: boolean
        default: false

permissions:
  contents: read

# Serialize assembly and deployment without replacing pending publications when
# another completion event arrives (even if that event's jobs will be skipped).
concurrency:
  group: github-pages
  queue: max
  cancel-in-progress: false

jobs:
  build:
    if: >-
      !inputs.maintenance_only &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.name != 'Build' && github.event.workflow_run.name != 'Server containers') ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         (github.event.workflow_run.name != 'Build' || github.event.workflow_run.head_sha == github.sha) &&
         github.event.workflow_run.head_repository.full_name == github.repository))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      # Always use the trusted default branch, including workflow_run events.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build existing project website
        if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Build'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add verified release repositories and update channels
        if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Build'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jekyll's Docker action writes root-owned output.
          sudo chown -R "$(id -u):$(id -g)" _site
          python3 scripts/p2_release.py site --repo "$GITHUB_REPOSITORY" --output _site --include-testing

      - name: Fetch the complete site from the successful main build
        if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Build'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
        run: python3 scripts/p2_release.py fetch-site --repo "$GITHUB_REPOSITORY" --run "$SOURCE_RUN" --output _site

      - name: Add verified Synology distribution channels
        env:
          GH_TOKEN: ${{ github.token }}
          SYNOLOGY_PREVIEW_ENABLED: ${{ vars.SYNOLOGY_PREVIEW_ENABLED }}
        run: |
          preview_args=()
          if [ "$SYNOLOGY_PREVIEW_ENABLED" = "true" ]; then preview_args+=(--include-preview); fi
          python3 scripts/synology_site.py --repo "$GITHUB_REPOSITORY" --output _site \
            --base-url https://turesheim.github.io/eclipse-timekeeper/synology/ "${preview_args[@]}"

      - name: Upload website and p2 repositories
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish website and update site
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Retain recent Pages deployment history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_retention.py pages --repo "$GITHUB_REPOSITORY" --keep 3 --apply

  maintenance:
    name: Clean temporary packages and Pages history
    if: github.event_name == 'workflow_dispatch' && inputs.maintenance_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Inventory or clean the retired registry and Pages records
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_CLEANUP: ${{ inputs.apply_cleanup }}
        run: |
          apply_args=()
          if [ "$APPLY_CLEANUP" = "true" ]; then apply_args+=(--apply); fi
          python3 scripts/github_retention.py registry --repo "$GITHUB_REPOSITORY" "${apply_args[@]}" --report target/retention/registry.json
          python3 scripts/github_retention.py pages --repo "$GITHUB_REPOSITORY" --keep 3 "${apply_args[@]}" --report target/retention/pages.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: github-retention-report
          path: target/retention/*.json
