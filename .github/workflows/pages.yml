name: Website and p2 update site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release p2 repository]
    types: [completed]
  release:
    types: [edited, deleted]
  workflow_dispatch:

permissions:
  contents: read

# Serialize the whole rebuild/deployment so an older snapshot cannot replace it.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      # Always use the trusted default branch, including workflow_run events.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build existing project website
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Add verified release repositories and update channels
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/p2_release.py site --repo "$GITHUB_REPOSITORY" --output _site

      - name: Upload website and p2 repositories
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
