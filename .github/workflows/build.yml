name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: |
          **/pom.xml
          **/META-INF/MANIFEST.MF
          default.target

    - name: Install Xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build with Maven
      run: xvfb-run --server-args="-screen 0, 1024x768x24" --auto-servernum mvn -B -ntp clean verify -Pother-os -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000 -Dscreenshots=${{ github.workspace }}/images

    - name: Upload test reports and screenshots
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: test-results
        path: |
          **/target/surefire-reports/
          net.resheim.eclipse.timekeeper.test/screenshots/
          images/
        if-no-files-found: warn

    - name: Upload p2 repository
      uses: actions/upload-artifact@v7.0.1
      with:
        name: p2-repository
        path: net.resheim.eclipse.timekeeper-site/target/repository
