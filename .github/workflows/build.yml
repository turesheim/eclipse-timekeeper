name: Build

# Feature branches are tested through their PR, avoiding a second push build.
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read
  actions: read

# PR updates supersede the whole run. Main jobs cancel only when replacement
# code validation starts, so docs-only pushes leave in-flight code builds intact.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Changes:
    name: Select validation jobs
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      eclipse: ${{ steps.changes.outputs.eclipse }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
    - id: changes
      run: python3 scripts/ci_changes.py

  API-contract:
    needs: Changes
    if: needs.Changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: common/api/tests/requirements.txt
    - name: Install API contract validators
      run: python -m pip install -r common/api/tests/requirements.txt
    - name: Validate OpenAPI and client/schema boundaries
      run: python -m unittest discover -s common/api/tests -v

  Server:
    needs: Changes
    if: needs.Changes.outputs.code == 'true'
    concurrency:
      group: build-server-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: |
          server/**/pom.xml
          .mvn/wrapper/maven-wrapper.properties
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.13'
    - name: Install HTTP contract validators
      run: python -m pip install -r common/api/tests/requirements.txt
    - name: Build and test standalone Quarkus server
      run: ./mvnw -B -ntp -f server/pom.xml clean verify
    - name: Package candidate server distribution
      run: python server/scripts/package_server.py --output server/target/distribution --commit "$GITHUB_SHA"
    - name: Verify packaged HTTP server, durable restart and authorization
      run: python server/scripts/acceptance.py --distribution server/target/distribution/timekeeper-server.zip
    - name: Upload server reports and acceptance evidence
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: server-test-results
        path: |
          server/**/target/surefire-reports/
          server/target/acceptance/
    - name: Upload standalone Java server distribution
      uses: actions/upload-artifact@v7.0.1
      with:
        name: server-standalone
        if-no-files-found: error
        path: |
          server/target/distribution/timekeeper-server.zip
          server/target/distribution/timekeeper-server.zip.sha256

  Web:
    needs: Server
    concurrency:
      group: build-web-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Browser/dependency installation can take eight minutes on a fresh runner.
    # Keep the bounded test suite's full runtime available after setup.
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 21
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: server/web/package-lock.json
    - uses: actions/download-artifact@v8.0.2
      with:
        name: server-standalone
        path: server/target/distribution
    - name: Install browser test dependencies
      run: npm ci --ignore-scripts --prefix server/web
    - name: Test time-zone, precision and HTTP session boundaries
      run: npm test --prefix server/web
    - name: Install Chromium
      working-directory: server/web
      run: npx playwright install --with-deps chromium
    - name: Verify bundled web client against the packaged server
      run: python3 server/web/tests/acceptance.py --distribution server/target/distribution/timekeeper-server.zip
    - name: Verify email recovery through HTTPS and actual SMTP delivery
      run: python3 server/web/tests/acceptance.py --distribution server/target/distribution/timekeeper-server.zip --https --mail --grep 'first administrator|email recovery'
    - name: Verify Journal WebDAV account help through HTTPS
      run: python3 server/web/tests/acceptance.py --distribution server/target/distribution/timekeeper-server.zip --https --grep 'Journal shows WebDAV|read-only accounts can view the WebDAV connection'
    - name: Upload browser acceptance evidence
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: web-acceptance
        path: |
          server/web/test-results/
          server/web/target/server.log

  Remote-Eclipse:
    name: Installed client tests
    needs: [Changes, Server]
    if: needs.Changes.outputs.eclipse == 'true'
    concurrency:
      group: build-installed-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: maven
    - uses: actions/download-artifact@v8.0.2
      with:
        name: server-standalone
        path: server/target/distribution
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: server/web/package-lock.json
    - name: Install browser peer for installed Eclipse acceptance
      run: |
        npm ci --ignore-scripts --prefix server/web
        cd server/web
        npx playwright install --with-deps chromium
    - name: Install Xvfb
      run: sudo apt-get update && sudo apt-get install -y xvfb xdotool
    - name: Verify installed Eclipse against the packaged server and restart
      run: xvfb-run --server-args="-screen 0, 1280x900x24" --auto-servernum ./mvnw -B -ntp clean verify -Premote-client-tests -pl .,common/timekeeper-domain,common/timekeeper-service-api,common/timekeeper-http-client,eclipse/net.resheim.eclipse.timekeeper.db,eclipse/net.resheim.eclipse.timekeeper.ui,eclipse/net.resheim.eclipse.timekeeper-feature,eclipse/net.resheim.eclipse.timekeeper.mylyn,eclipse/net.resheim.eclipse.timekeeper.mylyn-feature,eclipse/net.resheim.eclipse.timekeeper.remote-test,eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test -Dtycho.localArtifacts=ignore -Dtimekeeper.native.dialog-tests=true
    - name: Upload installed remote acceptance evidence
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: remote-eclipse-acceptance
        include-hidden-files: true
        path: |
          eclipse/net.resheim.eclipse.timekeeper.remote-test/target/surefire-reports/
          eclipse/net.resheim.eclipse.timekeeper.remote-test/target/surefire-reports-restart/
          eclipse/net.resheim.eclipse.timekeeper.remote-test/target/acceptance-data/proof.properties
          eclipse/net.resheim.eclipse.timekeeper.remote-test/target/acceptance-data/server-*.log
          eclipse/net.resheim.eclipse.timekeeper.remote-test/target/work/**/.metadata/.log
          eclipse/net.resheim.eclipse.timekeeper.remote-test/target/work/**/configuration/*.log
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports/
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports-restart/
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports-account/
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports-server/
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports-local/
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports-return/
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports-local-restart/
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/acceptance-data/proof.properties
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/acceptance-data/server-*.log
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/acceptance-data/browser-peer.log
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/acceptance-data/browser-peer-failure.*
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/work/**/.metadata/.log
          eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/work/**/configuration/*.log

  Publication-tooling:
    name: Packaging and channel tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify p2 packaging and release channels
      run: python3 -m unittest discover -s scripts/tests -v

  Publication:
    name: Build website and update site
    needs: [Changes, Build, API-contract, Server, Web, Remote-Eclipse, Publication-tooling]
    if: >-
      !cancelled() && needs.Changes.result == 'success' &&
      needs.Publication-tooling.result == 'success' &&
      (needs.Changes.outputs.code == 'false' ||
       (needs.API-contract.result == 'success' &&
        needs.Server.result == 'success' && needs.Web.result == 'success' &&
        (needs.Changes.outputs.eclipse == 'false' ||
         (needs.Build.result == 'success' && needs.Remote-Eclipse.result == 'success'))))
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Build project website
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site
    - name: Add verified current-matrix update site and release channels
      if: needs.Changes.outputs.eclipse == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Jekyll's Docker action writes root-owned output.
        sudo chown -R "$(id -u):$(id -g)" _site
        python3 scripts/p2_release.py build-site --repo "$GITHUB_REPOSITORY" \
          --output _site --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
        test -f _site/index.html
        test -f _site/updates/compositeContent.xml
        test -f _site/updates/testing/compositeContent.xml
    - name: Add existing tested Eclipse update site
      if: needs.Changes.outputs.eclipse == 'false'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sudo chown -R "$(id -u):$(id -g)" _site
        python3 scripts/p2_release.py docs-site --repo "$GITHUB_REPOSITORY" \
          --output _site --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
    - name: Upload complete website and update site
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: website-update-site
        path: _site/
        if-no-files-found: error

  Build:
    needs: Changes
    if: needs.Changes.outputs.eclipse == 'true'
    concurrency:
      group: build-platform-${{ matrix.os }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: |
          **/pom.xml
          **/META-INF/MANIFEST.MF
          eclipse/default.target
          eclipse/net.resheim.eclipse.timekeeper.jira-test/jira.target
          .mvn/wrapper/maven-wrapper.properties

    - name: Show build tool versions
      shell: bash
      run: ./mvnw --version

    - name: Install Xvfb
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build with Maven (Linux/X11)
      if: runner.os == 'Linux'
      run: xvfb-run --server-args="-screen 0, 1024x768x24" --auto-servernum ./mvnw -B -ntp clean verify -Pother-os,jira-connector-tests -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000 -Dscreenshots=${{ github.workspace }}/images

    - name: Build with Maven (macOS idle detector)
      if: runner.os == 'macOS'
      run: ./mvnw -B -ntp clean verify -Didle-platform-tests -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000 -Dscreenshots=${{ github.workspace }}/images

    - name: Build with Maven (Windows idle detector)
      if: runner.os == 'Windows'
      shell: pwsh
      run: .\mvnw.cmd -B -ntp clean verify "-Pother-os" "-Didle-platform-tests" "-Dtycho.localArtifacts=ignore" "-Dorg.eclipse.swtbot.search.timeout=20000" "-Dscreenshots=${{ github.workspace }}\images"

    - name: Upload test reports and screenshots
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: test-results-${{ runner.os }}-${{ runner.arch }}
        include-hidden-files: true
        path: |
          **/target/surefire-reports/
          **/target/surefire-reports-restart/
          **/target/test-reports/
          eclipse/net.resheim.eclipse.timekeeper.test/target/work/data/.metadata/.log
          eclipse/net.resheim.eclipse.timekeeper.native-test/target/work/data/.metadata/.log
          eclipse/net.resheim.eclipse.timekeeper.jira-test/target/work/**/.metadata/.log
          eclipse/net.resheim.eclipse.timekeeper.jira-test/target/work/**/configuration/*.log
          eclipse/net.resheim.eclipse.timekeeper.jira-test/target/acceptance-data/*.txt
          eclipse/net.resheim.eclipse.timekeeper.jira-test/target/acceptance-data/*.properties
          eclipse/net.resheim.eclipse.timekeeper.test/screenshots/
          images/
        if-no-files-found: warn

    - name: Upload p2 repository
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: p2-repository
        path: eclipse/net.resheim.eclipse.timekeeper-site/target/repository
