name: Build

# Feature branches are tested through their PR, avoiding a second push build.
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: |
          **/pom.xml
          **/META-INF/MANIFEST.MF
          default.target

    - name: Install Xvfb
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build with Maven (Linux/X11)
      if: runner.os == 'Linux'
      run: xvfb-run --server-args="-screen 0, 1024x768x24" --auto-servernum mvn -B -ntp clean verify -Pother-os -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000 -Dscreenshots=${{ github.workspace }}/images

    - name: Build with Maven (macOS idle detector)
      if: runner.os == 'macOS'
      run: mvn -B -ntp clean verify -Didle-platform-tests -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000 -Dscreenshots=${{ github.workspace }}/images

    - name: Build with Maven (Windows idle detector)
      if: runner.os == 'Windows'
      run: mvn -B -ntp clean verify "-Pother-os" "-Didle-platform-tests" "-Dtycho.localArtifacts=ignore" "-Dorg.eclipse.swtbot.search.timeout=20000" "-Dscreenshots=${{ github.workspace }}\images"

    - name: Upload test reports and screenshots
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: test-results-${{ runner.os }}-${{ runner.arch }}
        include-hidden-files: true
        path: |
          **/target/surefire-reports/
          **/target/test-reports/
          net.resheim.eclipse.timekeeper.test/target/work/data/.metadata/.log
          net.resheim.eclipse.timekeeper.test/screenshots/
          images/
        if-no-files-found: warn

    - name: Upload p2 repository
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: p2-repository
        path: net.resheim.eclipse.timekeeper-site/target/repository
