name: Build

# Feature branches are tested through their PR, avoiding a second push build.
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  Publication:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - name: Verify p2 packaging and release channels
      run: python3 -m unittest discover -s scripts/tests -v
    - name: Verify project website build
      uses: actions/jekyll-build-pages@v1
      with:
        source: ./
        destination: ./_site
    - name: Verify update site assembly from published releases
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Jekyll's Docker action writes root-owned output.
        sudo chown -R "$(id -u):$(id -g)" _site
        python3 scripts/p2_release.py site --repo "$GITHUB_REPOSITORY" --output _site
        test -f _site/index.html
        test -f _site/updates/compositeContent.xml

  Build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up JDK 21
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: 21
        cache: maven
        cache-dependency-path: |
          **/pom.xml
          **/META-INF/MANIFEST.MF
          default.target
          net.resheim.eclipse.timekeeper.jira-test/jira.target
          .mvn/wrapper/maven-wrapper.properties

    - name: Show build tool versions
      shell: bash
      run: ./mvnw --version

    - name: Install Xvfb
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Build with Maven (Linux/X11)
      if: runner.os == 'Linux'
      run: xvfb-run --server-args="-screen 0, 1024x768x24" --auto-servernum ./mvnw -B -ntp clean verify -Pother-os,jira-connector-tests -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000 -Dscreenshots=${{ github.workspace }}/images

    - name: Build with Maven (macOS idle detector)
      if: runner.os == 'macOS'
      run: ./mvnw -B -ntp clean verify -Didle-platform-tests -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000 -Dscreenshots=${{ github.workspace }}/images

    - name: Build with Maven (Windows idle detector)
      if: runner.os == 'Windows'
      shell: pwsh
      run: .\mvnw.cmd -B -ntp clean verify "-Pother-os" "-Didle-platform-tests" "-Dtycho.localArtifacts=ignore" "-Dorg.eclipse.swtbot.search.timeout=20000" "-Dscreenshots=${{ github.workspace }}\images"

    - name: Upload test reports and screenshots
      uses: actions/upload-artifact@v7.0.1
      if: always()
      with:
        name: test-results-${{ runner.os }}-${{ runner.arch }}
        include-hidden-files: true
        path: |
          **/target/surefire-reports/
          **/target/surefire-reports-restart/
          **/target/test-reports/
          net.resheim.eclipse.timekeeper.test/target/work/data/.metadata/.log
          net.resheim.eclipse.timekeeper.native-test/target/work/data/.metadata/.log
          net.resheim.eclipse.timekeeper.jira-test/target/work/**/.metadata/.log
          net.resheim.eclipse.timekeeper.jira-test/target/work/**/configuration/*.log
          net.resheim.eclipse.timekeeper.jira-test/target/acceptance-data/*.txt
          net.resheim.eclipse.timekeeper.jira-test/target/acceptance-data/*.properties
          net.resheim.eclipse.timekeeper.test/screenshots/
          images/
        if-no-files-found: warn

    - name: Upload p2 repository
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v7.0.1
      with:
        name: p2-repository
        path: net.resheim.eclipse.timekeeper-site/target/repository
