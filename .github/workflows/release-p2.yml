name: Release p2 and server distributions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to build or retry (for example v2.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-p2-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out publication tools
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate published release and existing assets
        id: release
        run: python3 scripts/p2_release.py prepare --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --require-server

      - name: Check out release tag
        if: steps.release.outputs.reuse != 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          path: release-source
          persist-credentials: false

      - name: Set up Python for API contract checks
        if: steps.release.outputs.reuse != 'true'
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'

      - name: Validate the tagged API contract
        if: steps.release.outputs.reuse != 'true'
        working-directory: release-source
        run: |
          python -m pip install -r common/api/tests/requirements.txt
          python -m unittest discover -s common/api/tests -v

      - name: Set up JDK 21
        if: steps.release.outputs.reuse != 'true'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: |
            release-source/**/pom.xml
            release-source/**/META-INF/MANIFEST.MF
            release-source/eclipse/default.target
            release-source/eclipse/net.resheim.eclipse.timekeeper.jira-test/jira.target
            release-source/.mvn/wrapper/maven-wrapper.properties

      - name: Set up Node for browser acceptance
        if: steps.release.outputs.reuse != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release-source/server/web/package-lock.json

      - name: Install locked browser dependencies and Chromium
        if: steps.release.outputs.reuse != 'true'
        working-directory: release-source/server/web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Build and test the tagged server
        if: steps.release.outputs.reuse != 'true'
        working-directory: release-source
        run: ./mvnw -B -ntp -f server/pom.xml clean verify

      - name: Package the tagged server and bundled web client
        if: steps.release.outputs.reuse != 'true'
        working-directory: release-source
        run: |
          python server/scripts/package_server.py --output server/target/distribution \
            --tag "$RELEASE_TAG" --commit "$(git rev-parse HEAD)"

      - name: Verify packaged HTTP server and browser client
        if: steps.release.outputs.reuse != 'true'
        working-directory: release-source
        run: |
          python server/scripts/acceptance.py --distribution server/target/distribution/timekeeper-server.zip
          npm test --prefix server/web
          python server/web/tests/acceptance.py --distribution server/target/distribution/timekeeper-server.zip

      - name: Install Xvfb
        if: steps.release.outputs.reuse != 'true'
        run: sudo apt-get update && sudo apt-get install -y xvfb xdotool

      - name: Build and test the tagged source
        if: steps.release.outputs.reuse != 'true'
        working-directory: release-source
        run: xvfb-run --auto-servernum --server-args="-screen 0, 1024x768x24" ./mvnw -B -ntp clean verify -Pother-os,jira-connector-tests -Dtycho.localArtifacts=ignore -Dorg.eclipse.swtbot.search.timeout=20000

      - name: Package and validate p2 repository
        if: steps.release.outputs.reuse != 'true'
        run: |
          python3 scripts/p2_release.py package \
            --repository release-source/eclipse/net.resheim.eclipse.timekeeper-site/target/repository \
            --tag "$RELEASE_TAG" --commit "$(git -C release-source rev-parse HEAD)" \
            --output "$RUNNER_TEMP/release-assets"

      - name: Verify installed Eclipse with browser peer and real GTK dialogs
        if: steps.release.outputs.reuse != 'true'
        working-directory: release-source
        run: xvfb-run --auto-servernum --server-args="-screen 0, 1280x900x24" ./mvnw -B -ntp clean verify -Premote-client-tests -pl .,common/timekeeper-domain,common/timekeeper-service-api,common/timekeeper-http-client,eclipse/net.resheim.eclipse.timekeeper.db,eclipse/net.resheim.eclipse.timekeeper.ui,eclipse/net.resheim.eclipse.timekeeper-feature,eclipse/net.resheim.eclipse.timekeeper.mylyn,eclipse/net.resheim.eclipse.timekeeper.mylyn-feature,eclipse/net.resheim.eclipse.timekeeper.remote-test,eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test -Dtycho.localArtifacts=ignore -Dtimekeeper.native.dialog-tests=true

      - name: Assemble and verify both release distributions
        if: steps.release.outputs.reuse != 'true'
        run: |
          cp release-source/server/target/distribution/timekeeper-server.zip* "$RUNNER_TEMP/release-assets/"
          python3 - "$RUNNER_TEMP/release-assets" "$RELEASE_TAG" <<'PY'
          import sys
          from pathlib import Path
          from scripts.p2_release import verify_complete_assets
          verify_complete_assets(Path(sys.argv[1]), sys.argv[2])
          PY

      - name: Attach distributions and checksums to release
        if: steps.release.outputs.reuse != 'true'
        run: |
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "$RUNNER_TEMP/release-assets/timekeeper-p2.zip" \
            "$RUNNER_TEMP/release-assets/timekeeper-p2.zip.sha256" \
            "$RUNNER_TEMP/release-assets/timekeeper-server.zip" \
            "$RUNNER_TEMP/release-assets/timekeeper-server.zip.sha256"

      - name: Upload test reports and Error Logs
        if: always() && steps.release.outputs.reuse != 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-test-results
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            release-source/**/target/surefire-reports/
            release-source/**/target/surefire-reports-restart/
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/surefire-reports-*/
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-test/target/acceptance-data/proof.properties
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/acceptance-data/proof.properties
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-*/target/acceptance-data/server-*.log
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/acceptance-data/browser-peer.log
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-mylyn-test/target/acceptance-data/browser-peer-failure.*
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-*/target/work/**/.metadata/.log
            release-source/eclipse/net.resheim.eclipse.timekeeper.remote-*/target/work/**/configuration/*.log
            release-source/server/target/acceptance/
            release-source/server/web/test-results/
            release-source/server/web/target/server.log
            release-source/**/target/test-reports/
            release-source/**/target/work/data/.metadata/.log
            release-source/eclipse/net.resheim.eclipse.timekeeper.jira-test/target/work/**/.metadata/.log
            release-source/eclipse/net.resheim.eclipse.timekeeper.jira-test/target/work/**/configuration/*.log
            release-source/eclipse/net.resheim.eclipse.timekeeper.jira-test/target/acceptance-data/*.txt
            release-source/eclipse/net.resheim.eclipse.timekeeper.jira-test/target/acceptance-data/*.properties
