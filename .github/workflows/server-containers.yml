name: Server containers

on:
  workflow_call:
    inputs:
      build_revision:
        type: string
        default: '0'
      h2_verified:
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: server-containers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select container validation
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.synology_distribution }}
      full: ${{ steps.changes.outputs.container_full }}
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 scripts/ci_changes.py
      - id: revision
        if: steps.changes.outputs.synology_distribution == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_BUILD_REVISION: ${{ inputs.build_revision || 0 }}
        run: python3 scripts/ci_synology_revision.py

  prepare:
    name: Build shared server image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    concurrency:
      group: containers-prepare-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Build and test the H2 server
        if: inputs.h2_verified != true && needs.changes.outputs.full == 'true'
        run: ./mvnw -B -ntp -f server/pom.xml clean verify
      - name: Build actual deployment images
        run: |
          docker build --build-arg DAGSVERK_BUILD_COMMIT="$GITHUB_SHA" --build-arg DAGSVERK_BUILD_DIRTY=false -t timekeeper-server:test -f server/Dockerfile .
          docker build --build-arg DAGSVERK_BUILD_COMMIT="$GITHUB_SHA" --build-arg DAGSVERK_BUILD_DIRTY=false -t dagsverk-connect:review -f server/connect/Dockerfile .
          docker pull postgres:18.6-bookworm
      - name: Package the Docker Compose deployment
        run: |
          python server/scripts/package_deployment.py --output timekeeper-compose.tar.gz --commit "$GITHUB_SHA"
          docker tag timekeeper-server:test "timekeeper-server:sha-$GITHUB_SHA"
          docker save "timekeeper-server:sha-$GITHUB_SHA" postgres:18.6-bookworm | gzip > timekeeper-images-linux-amd64.tar.gz
          sha256sum timekeeper-compose.tar.gz timekeeper-images-linux-amd64.tar.gz > checksums.sha256
          printf 'TIMEKEEPER_SERVER_IMAGE=timekeeper-server:sha-%s\nTIMEKEEPER_POSTGRES_IMAGE=postgres:18.6-bookworm\n' "$GITHUB_SHA" > images.env
      - name: Upload Docker Compose distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-compose
          if-no-files-found: error
          path: |
            timekeeper-compose.tar.gz
            timekeeper-images-linux-amd64.tar.gz
            checksums.sha256
            images.env
      - name: Upload H2 server test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-h2-test-results
          path: server/**/target/surefire-reports/

  smoke:
    name: Deployment startup and bundled web
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: server-compose
          path: server/target/smoke-input
      - name: Load the exact shared deployment image
        run: |
          (cd server/target/smoke-input && sha256sum -c checksums.sha256)
          docker load -i server/target/smoke-input/timekeeper-images-linux-amd64.tar.gz
          docker tag "timekeeper-server:sha-$GITHUB_SHA" timekeeper-server:test
      - name: Verify unprivileged replicas, shared storage, commit and web assets
        run: |
          python -m pip install -r common/api/tests/requirements.txt
          python server/scripts/compose_acceptance.py --smoke --expected-commit "$GITHUB_SHA" --output server/target/compose-smoke
      - name: Upload startup evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-compose-smoke
          path: server/target/compose-smoke/

  verify:
    needs: [changes, prepare]
    if: needs.changes.outputs.full == 'true'
    concurrency:
      group: containers-pg18-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: server-compose
          path: server/target/compose-input
      - name: Load the shared image for PostgreSQL 18 validation
        run: |
          (cd server/target/compose-input && sha256sum -c checksums.sha256)
          docker load -i server/target/compose-input/timekeeper-images-linux-amd64.tar.gz
          docker tag "timekeeper-server:sha-$GITHUB_SHA" timekeeper-server:test
      - name: Test PostgreSQL schema and concurrent bootstrap
        env:
          TIMEKEEPER_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55432/postgres
          TIMEKEEPER_INSTANCE_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55432/postgres
          TIMEKEEPER_INSTANCE_TEST_PG_PASSWORD: isolated-ci-test
          TIMEKEEPER_TEST_INSTANCE_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_instance
          TIMEKEEPER_TEST_RECOVERY_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_recovery
          TIMEKEEPER_TEST_PASSKEY_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_passkeys
          TIMEKEEPER_TEST_CALENDAR_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_calendars
          TIMEKEEPER_TEST_TASK_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_tasks
          TIMEKEEPER_TEST_CONNECT_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_connect
          TIMEKEEPER_TEST_SETTINGS_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_settings
          TIMEKEEPER_TEST_ARCHIVE_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_archive
          TIMEKEEPER_TEST_PG_USER: postgres
          TIMEKEEPER_TEST_PG_PASSWORD: isolated-ci-test
        run: |
          docker run -d --name timekeeper-pg-test -e POSTGRES_PASSWORD=isolated-ci-test -p 127.0.0.1:55432:5432 postgres:18.6-bookworm
          for attempt in $(seq 1 60); do
            if docker exec timekeeper-pg-test pg_isready -h 127.0.0.1 -U postgres; then break; fi
            echo "Waiting for isolated PostgreSQL (attempt $attempt)"
            sleep 1
          done
          docker exec timekeeper-pg-test psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE timekeeper_instance' -c 'CREATE DATABASE timekeeper_recovery' -c 'CREATE DATABASE timekeeper_passkeys' -c 'CREATE DATABASE timekeeper_settings' -c 'CREATE DATABASE timekeeper_archive_export' -c 'CREATE DATABASE timekeeper_archive_import' -c 'CREATE DATABASE timekeeper_archive_http' -c 'CREATE DATABASE timekeeper_archive_upload' -c 'CREATE DATABASE timekeeper_calendars' -c 'CREATE DATABASE timekeeper_tasks_task_provider_writes' -c 'CREATE DATABASE timekeeper_tasks_task_provider_scans' -c 'CREATE DATABASE timekeeper_tasks_task_cloud_pull' -c 'CREATE DATABASE timekeeper_tasks_task_provider_http' -c 'CREATE DATABASE timekeeper_tasks_internet_calendars' -c 'CREATE DATABASE timekeeper_tasks_shared_connect_http' -c 'CREATE DATABASE timekeeper_connect' -c 'CREATE DATABASE timekeeper_tasks_task_provider_identities' -c 'CREATE DATABASE timekeeper_archive_files' -c 'CREATE DATABASE timekeeper_archive_vault' -c 'CREATE DATABASE timekeeper_archive_vaultindex' -c 'CREATE DATABASE timekeeper_archive_vaultcontent' -c 'CREATE DATABASE timekeeper_archive_vaultsources' -c 'CREATE DATABASE timekeeper_archive_vaultreadperformance' -c 'CREATE DATABASE timekeeper_archive_vaultsettings' -c 'CREATE DATABASE timekeeper_archive_vaultstate' -c 'CREATE DATABASE timekeeper_archive_vaultcatalog' -c 'CREATE DATABASE timekeeper_archive_vaultcollection' -c 'CREATE DATABASE timekeeper_archive_vaulthttp' -c 'CREATE DATABASE timekeeper_archive_vaultarchivequota' -c 'CREATE DATABASE timekeeper_archive_notesexport' -c 'CREATE DATABASE timekeeper_archive_notesoverwrite' -c 'CREATE DATABASE timekeeper_archive_vaultrecent' -c 'CREATE DATABASE timekeeper_archive_vaultsearchchanges' -c 'CREATE DATABASE timekeeper_archive_vaultsearchsources' -c 'CREATE DATABASE timekeeper_archive_vaultsearchhttp' -c 'CREATE DATABASE timekeeper_archive_notetasks' -c 'CREATE DATABASE timekeeper_archive_notetaskarchive'
          ./mvnw -B -ntp -f server/pom.xml test -Dtest=PostgresSchemaIT,InstanceRestoreFenceTest,InstanceRestoreDatabaseTest,InstanceRestoreIntentTest,InstanceRestoreMaterialTest,InstanceRestoreRecoveryTest,InstanceOperationsTest,InstanceAdministratorTest,InstanceBackupArchiveTest,InstanceConfigurationTest,InstanceDatabaseImageTest,InstanceBackupEncryptionTest,EmailRecoveryStoreTest,PasskeyStoreTest,PasskeyCredentialsTest,PasskeyCeremoniesTest,ServiceSettingsTest,AccountArchiveTest,AccountArchiveImportTest,AccountArchiveHttpTest,AccountUploadsTest,CalendarHttpTest,TaskProviderWritesTest,TaskProviderIdentitiesTest,TaskProviderScansTest,TaskCloudPullTest,TaskProviderResourceHttpTest,InternetCalendarsTest,InternetCalendarCodecTest,CalendarCloudProviderTest,SharedConnectResourceHttpTest,ConnectResourceTest,ConnectProviderTest,ConnectProtocolTest,LuceneSearchSpikeTest,NotesSearchChangesTest,NotesSearchSourcesTest,NotesSearchReplayTest,NotesSearchServiceTest,NotesSearchHttpTest,AccountArchiveFilesTest,VaultArchiveTest,VaultArchiveQuotaTest,VaultIndexTest,VaultContentTest,VaultSourcesTest,VaultReadPerformanceTest,VaultSettingsTest,VaultStateTest,VaultCatalogTest,VaultCollectionTest,VaultDavHttpTest,VaultImportExportTest,VaultImportOverwriteTest,RecentNotesTest,NoteTasksTest,NoteTaskArchiveTest -Dsurefire.failIfNoSpecifiedTests=false
          docker rm -f timekeeper-pg-test
      - name: Verify task-provider recovery across server JVM restarts on PostgreSQL 18
        run: python server/scripts/task_provider_restart.py --expected-commit "$GITHUB_SHA" --postgres-image postgres:18.6-bookworm --output server/target/compose-acceptance/task-provider-restart.json
      - name: Verify HTTP contracts, rolling updates, backups and durable restart
        run: |
          python -m pip install -r common/api/tests/requirements.txt
          python server/scripts/compose_acceptance.py
      - name: Verify Notes search across actual replicas and private caches
        run: python server/scripts/notes_search_replica_acceptance.py --server-image timekeeper-server:test --expected-commit "$GITHUB_SHA"
      - name: Verify full instance migration and Compose material disaster recovery
        run: python server/scripts/compose_instance_restore_acceptance.py --server-image timekeeper-server:test --expected-commit "$GITHUB_SHA" --notes-search
      - name: Verify email recovery across actual replicas and hostname cutover
        run: python server/scripts/email_replica_acceptance.py --server-image timekeeper-server:test
      - name: Verify signed passkeys across replicas, revocation and origin migration
        run: python server/scripts/passkey_replica_acceptance.py --server-image timekeeper-server:test --expected-commit "$GITHUB_SHA"
      - name: Verify private account archives across replicas and protected restore
        run: python server/scripts/archive_replica_acceptance.py --server-image timekeeper-server:test --expected-commit "$GITHUB_SHA"
      - name: Verify schema upgrades during protected backup restore
        run: python server/scripts/schema_restore_acceptance.py
      - name: Verify import and Undo across replicas, restart and protected restore
        run: python server/scripts/toggl_replica_acceptance.py --server-image timekeeper-server:test
      - name: Upload container test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: server-compose-test-results
          path: |
            server/**/target/surefire-reports/
            server/target/compose-acceptance/
            server/target/acceptance/instance-compose.json
            server/target/toggl-replica-acceptance.json
            server/target/toggl-replica-acceptance.failure.log
            server/target/passkey-replica-acceptance.json
            server/target/archive-replica-acceptance.json

  verify-synology-native:
    name: Synology native (${{ matrix.group }})
    needs: [changes, prepare]
    if: needs.changes.outputs.full == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        group: [installer, upgrade-early, upgrade-late, restore, migrate-early, migrate-late, migrate-runtime]
    concurrency:
      group: containers-native-${{ matrix.group }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        if: matrix.group == 'migrate-runtime'
        with:
          name: server-compose
          path: server/target/native-input
      - name: Load the runtime migration image
        if: matrix.group == 'migrate-runtime'
        run: |
          (cd server/target/native-input && sha256sum -c checksums.sha256)
          docker load -i server/target/native-input/timekeeper-images-linux-amd64.tar.gz
          docker tag "timekeeper-server:sha-$GITHUB_SHA" timekeeper-server:test
      - name: Pull native acceptance databases
        run: |
          docker pull postgres:17.11-bookworm
          docker pull postgres:18.6-bookworm
      - name: Verify native acceptance group
        env:
          ACCEPTANCE_GROUP: ${{ matrix.group }}
          GOCACHE: ${{ runner.temp }}/synology-go-cache
        run: python scripts/ci_synology.py "$ACCEPTANCE_GROUP" --server-image timekeeper-server:test
      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: synology-native-${{ matrix.group }}
          path: |
            server/target/synology-native/
            server/target/synology-acceptance/
            server/target/schema-restore-acceptance*/

  verify-synology:
    name: Synology candidate and PostgreSQL 17
    env:
      SYNOLOGY_REVISION: ${{ needs.changes.outputs.revision }}
    needs: [changes, prepare]
    if: needs.changes.outputs.full == 'true'
    concurrency:
      group: containers-pg17-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: server-compose
          path: server/target/synology-input
      - name: Load the shared image for PostgreSQL 17 validation
        run: |
          (cd server/target/synology-input && sha256sum -c checksums.sha256)
          docker load -i server/target/synology-input/timekeeper-images-linux-amd64.tar.gz
          docker tag "timekeeper-server:sha-$GITHUB_SHA" "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA"
      - name: Verify PostgreSQL 17 schema and concurrent bootstrap
        env:
          TIMEKEEPER_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55433/postgres
          TIMEKEEPER_INSTANCE_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55433/postgres
          TIMEKEEPER_INSTANCE_TEST_PG_PASSWORD: isolated-ci-test
          TIMEKEEPER_TEST_INSTANCE_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_instance
          TIMEKEEPER_TEST_RECOVERY_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_recovery
          TIMEKEEPER_TEST_PASSKEY_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_passkeys
          TIMEKEEPER_TEST_CALENDAR_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_calendars
          TIMEKEEPER_TEST_TASK_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_tasks
          TIMEKEEPER_TEST_CONNECT_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_connect
          TIMEKEEPER_TEST_SETTINGS_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_settings
          TIMEKEEPER_TEST_ARCHIVE_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_archive
          TIMEKEEPER_TEST_PG_USER: postgres
          TIMEKEEPER_TEST_PG_PASSWORD: isolated-ci-test
        run: |
          docker run -d --name timekeeper-pg17-test -e POSTGRES_PASSWORD=isolated-ci-test -p 127.0.0.1:55433:5432 postgres:17.11-bookworm
          for attempt in $(seq 1 60); do
            if docker exec timekeeper-pg17-test pg_isready -h 127.0.0.1 -U postgres; then break; fi
            echo "Waiting for isolated PostgreSQL 17 (attempt $attempt)"
            sleep 1
          done
          docker exec timekeeper-pg17-test psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE timekeeper_instance' -c 'CREATE DATABASE timekeeper_recovery' -c 'CREATE DATABASE timekeeper_passkeys' -c 'CREATE DATABASE timekeeper_settings' -c 'CREATE DATABASE timekeeper_archive_export' -c 'CREATE DATABASE timekeeper_archive_import' -c 'CREATE DATABASE timekeeper_archive_http' -c 'CREATE DATABASE timekeeper_archive_upload' -c 'CREATE DATABASE timekeeper_calendars' -c 'CREATE DATABASE timekeeper_tasks_task_provider_writes' -c 'CREATE DATABASE timekeeper_tasks_task_provider_scans' -c 'CREATE DATABASE timekeeper_tasks_task_cloud_pull' -c 'CREATE DATABASE timekeeper_tasks_task_provider_http' -c 'CREATE DATABASE timekeeper_tasks_internet_calendars' -c 'CREATE DATABASE timekeeper_tasks_shared_connect_http' -c 'CREATE DATABASE timekeeper_connect' -c 'CREATE DATABASE timekeeper_tasks_task_provider_identities' -c 'CREATE DATABASE timekeeper_archive_files' -c 'CREATE DATABASE timekeeper_archive_vault' -c 'CREATE DATABASE timekeeper_archive_vaultindex' -c 'CREATE DATABASE timekeeper_archive_vaultcontent' -c 'CREATE DATABASE timekeeper_archive_vaultsources' -c 'CREATE DATABASE timekeeper_archive_vaultreadperformance' -c 'CREATE DATABASE timekeeper_archive_vaultsettings' -c 'CREATE DATABASE timekeeper_archive_vaultstate' -c 'CREATE DATABASE timekeeper_archive_vaultcatalog' -c 'CREATE DATABASE timekeeper_archive_vaultcollection' -c 'CREATE DATABASE timekeeper_archive_vaulthttp' -c 'CREATE DATABASE timekeeper_archive_vaultarchivequota' -c 'CREATE DATABASE timekeeper_archive_notesexport' -c 'CREATE DATABASE timekeeper_archive_notesoverwrite' -c 'CREATE DATABASE timekeeper_archive_vaultrecent' -c 'CREATE DATABASE timekeeper_archive_vaultsearchchanges' -c 'CREATE DATABASE timekeeper_archive_vaultsearchsources' -c 'CREATE DATABASE timekeeper_archive_vaultsearchhttp' -c 'CREATE DATABASE timekeeper_archive_notetasks' -c 'CREATE DATABASE timekeeper_archive_notetaskarchive'
          ./mvnw -B -ntp -f server/pom.xml test -Dtest=PostgresSchemaIT,InstanceRestoreFenceTest,InstanceRestoreDatabaseTest,InstanceRestoreIntentTest,InstanceRestoreMaterialTest,InstanceRestoreRecoveryTest,InstanceOperationsTest,InstanceAdministratorTest,InstanceBackupArchiveTest,InstanceConfigurationTest,InstanceDatabaseImageTest,InstanceBackupEncryptionTest,EmailRecoveryStoreTest,PasskeyStoreTest,PasskeyCredentialsTest,PasskeyCeremoniesTest,ServiceSettingsTest,AccountArchiveTest,AccountArchiveImportTest,AccountArchiveHttpTest,AccountUploadsTest,CalendarHttpTest,TaskProviderWritesTest,TaskProviderIdentitiesTest,TaskProviderScansTest,TaskCloudPullTest,TaskProviderResourceHttpTest,InternetCalendarsTest,InternetCalendarCodecTest,CalendarCloudProviderTest,SharedConnectResourceHttpTest,ConnectResourceTest,ConnectProviderTest,ConnectProtocolTest,LuceneSearchSpikeTest,NotesSearchChangesTest,NotesSearchSourcesTest,NotesSearchReplayTest,NotesSearchServiceTest,NotesSearchHttpTest,AccountArchiveFilesTest,VaultArchiveTest,VaultArchiveQuotaTest,VaultIndexTest,VaultContentTest,VaultSourcesTest,VaultReadPerformanceTest,VaultSettingsTest,VaultStateTest,VaultCatalogTest,VaultCollectionTest,VaultDavHttpTest,VaultImportExportTest,VaultImportOverwriteTest,RecentNotesTest,NoteTasksTest,NoteTaskArchiveTest -Dsurefire.failIfNoSpecifiedTests=false
          docker rm -f -v timekeeper-pg17-test
      - name: Verify task-provider recovery across server JVM restarts on PostgreSQL 17
        run: python server/scripts/task_provider_restart.py --expected-commit "$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/synology-acceptance/task-provider-restart.json
      - name: Verify Notes search across PostgreSQL 17 replicas
        run: python server/scripts/notes_search_replica_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --expected-commit "$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/notes-search-pg17-replicas.json
      - name: Verify real API, backup, recovery and rolling updates with PostgreSQL 17
        run: |
          python -m pip install -r common/api/tests/requirements.txt
          python server/scripts/compose_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/synology-acceptance
      - name: Verify import and Undo with PostgreSQL 17
        run: python server/scripts/toggl_replica_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/toggl-pg17-acceptance.json
      - name: Verify signed passkeys and hostname migration with PostgreSQL 17
        run: python server/scripts/passkey_replica_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --expected-commit "$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/passkey-pg17-acceptance.json
      - name: Verify private account archives with PostgreSQL 17
        run: python server/scripts/archive_replica_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --expected-commit "$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/archive-pg17-acceptance.json
      - name: Build and validate the self-contained preview package
        run: python server/scripts/package_synology.py --commit "$GITHUB_SHA" --image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --revision "$SYNOLOGY_REVISION" --output server/target/synology
      - name: Build the independent Dagsverk migration destination
        run: python server/scripts/package_synology.py --commit "$GITHUB_SHA" --image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --revision "$SYNOLOGY_REVISION" --package-id dagsverk --output server/target/synology-migration
      - name: Verify full-instance migration between independent native packages
        run: python server/synology/tests/instance_migration_acceptance.py --timekeeper-package "server/target/synology/timekeeper-1.99.0-$SYNOLOGY_REVISION-r1000.spk" --dagsverk-package "server/target/synology-migration/dagsverk-1.99.0-$SYNOLOGY_REVISION-r1000.spk" --expected-commit "$GITHUB_SHA" --output server/target/synology-acceptance/instance-packages.json
      - name: Generate preview discovery metadata for NAS acceptance
        run: |
          python server/scripts/synology_catalog.py --package "server/target/synology/timekeeper-1.99.0-$SYNOLOGY_REVISION-r1000.spk" --base-url "https://turesheim.github.io/eclipse-timekeeper/synology/preview/r1000/"
          python server/scripts/promote_synology.py --package "server/target/synology/timekeeper-1.99.0-$SYNOLOGY_REVISION-r1000.spk" --write-template server/target/synology/dsm-acceptance-template.json
      - name: Upload Synology installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: synology-installer
          compression-level: 0
          if-no-files-found: error
          path: |
            server/target/synology/*.spk
            server/target/synology/*.spk.sha256
            server/target/synology/*.json
            server/target/synology/*.png
      - name: Upload migration test packages separately
        uses: actions/upload-artifact@v7.0.1
        with:
          name: synology-migration-test-packages
          compression-level: 0
          if-no-files-found: error
          path: |
            server/target/synology-migration/*.spk
            server/target/synology-migration/*.spk.sha256
            server/target/synology-migration/*.json
      - name: Upload Synology test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: synology-test-results
          path: |
            server/target/synology-acceptance/
            server/target/toggl-pg17-acceptance.json
            server/target/toggl-pg17-acceptance.failure.log
            server/target/passkey-pg17-acceptance.json
            server/target/archive-pg17-acceptance.json
            server/**/target/surefire-reports/

  package-web-preview:
    name: Synology web preview
    env:
      SYNOLOGY_REVISION: ${{ needs.changes.outputs.revision }}
    needs: [changes, prepare, smoke]
    if: needs.changes.outputs.full == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: server-compose
          path: server/target/preview-input
      - name: Load the smoke-tested immutable server image
        run: |
          (cd server/target/preview-input && sha256sum -c checksums.sha256)
          docker load -i server/target/preview-input/timekeeper-images-linux-amd64.tar.gz
          docker tag "timekeeper-server:sha-$GITHUB_SHA" "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA"
      - name: Package and validate the current web preview
        run: |
          python server/scripts/package_synology.py --commit "$GITHUB_SHA" --image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --revision "$SYNOLOGY_REVISION" --output server/target/synology
          python server/scripts/synology_catalog.py --package "server/target/synology/timekeeper-1.99.0-$SYNOLOGY_REVISION-r1000.spk" --base-url "https://turesheim.github.io/eclipse-timekeeper/synology/preview/r1000/"
          python server/scripts/promote_synology.py --package "server/target/synology/timekeeper-1.99.0-$SYNOLOGY_REVISION-r1000.spk" --write-template server/target/synology/dsm-acceptance-template.json
      - name: Upload the installable web preview
        uses: actions/upload-artifact@v7.0.1
        with:
          name: synology-installer
          compression-level: 0
          if-no-files-found: error
          path: |
            server/target/synology/*.spk
            server/target/synology/*.spk.sha256
            server/target/synology/*.json
            server/target/synology/*.png
