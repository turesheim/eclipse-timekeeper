name: Server containers

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-containers-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select container validation
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: python3 scripts/ci_changes.py

  prepare:
    name: Build shared server image
    needs: changes
    if: needs.changes.outputs.code == 'true'
    concurrency:
      group: containers-prepare-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Build and test the H2 server
        run: ./mvnw -B -ntp -f server/pom.xml clean verify
      - name: Build actual deployment images
        run: |
          docker build --build-arg TIMEKEEPER_BUILD_COMMIT="$GITHUB_SHA" --build-arg TIMEKEEPER_BUILD_DIRTY=false -t timekeeper-server:test -f server/Dockerfile .
          docker pull postgres:18.6-bookworm
      - name: Package the Docker Compose deployment
        run: |
          python server/scripts/package_deployment.py --output timekeeper-compose.tar.gz --commit "$GITHUB_SHA"
          docker tag timekeeper-server:test "timekeeper-server:sha-$GITHUB_SHA"
          docker save "timekeeper-server:sha-$GITHUB_SHA" postgres:18.6-bookworm | gzip > timekeeper-images-linux-amd64.tar.gz
          sha256sum timekeeper-compose.tar.gz timekeeper-images-linux-amd64.tar.gz > checksums.sha256
          printf 'TIMEKEEPER_SERVER_IMAGE=timekeeper-server:sha-%s\nTIMEKEEPER_POSTGRES_IMAGE=postgres:18.6-bookworm\n' "$GITHUB_SHA" > images.env
      - name: Upload Docker Compose distribution
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-compose
          if-no-files-found: error
          path: |
            timekeeper-compose.tar.gz
            timekeeper-images-linux-amd64.tar.gz
            checksums.sha256
            images.env
      - name: Upload H2 server test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: server-h2-test-results
          path: server/**/target/surefire-reports/

  verify:
    needs: prepare
    concurrency:
      group: containers-pg18-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: server-compose
          path: server/target/compose-input
      - name: Load the shared image for PostgreSQL 18 validation
        run: |
          (cd server/target/compose-input && sha256sum -c checksums.sha256)
          docker load -i server/target/compose-input/timekeeper-images-linux-amd64.tar.gz
          docker tag "timekeeper-server:sha-$GITHUB_SHA" timekeeper-server:test
      - name: Test PostgreSQL schema and concurrent bootstrap
        env:
          TIMEKEEPER_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55432/postgres
          TIMEKEEPER_TEST_RECOVERY_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_recovery
          TIMEKEEPER_TEST_PASSKEY_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_passkeys
          TIMEKEEPER_TEST_CALENDAR_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_calendars
          TIMEKEEPER_TEST_SETTINGS_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_settings
          TIMEKEEPER_TEST_ARCHIVE_DB_URL: jdbc:postgresql://127.0.0.1:55432/timekeeper_archive
          TIMEKEEPER_TEST_PG_USER: postgres
          TIMEKEEPER_TEST_PG_PASSWORD: isolated-ci-test
        run: |
          docker run -d --name timekeeper-pg-test -e POSTGRES_PASSWORD=isolated-ci-test -p 127.0.0.1:55432:5432 postgres:18.6-bookworm
          for attempt in $(seq 1 60); do
            if docker exec timekeeper-pg-test pg_isready -h 127.0.0.1 -U postgres; then break; fi
            echo "Waiting for isolated PostgreSQL (attempt $attempt)"
            sleep 1
          done
          docker exec timekeeper-pg-test psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE timekeeper_recovery' -c 'CREATE DATABASE timekeeper_passkeys' -c 'CREATE DATABASE timekeeper_settings' -c 'CREATE DATABASE timekeeper_archive_export' -c 'CREATE DATABASE timekeeper_archive_import' -c 'CREATE DATABASE timekeeper_archive_http' -c 'CREATE DATABASE timekeeper_archive_upload' -c 'CREATE DATABASE timekeeper_archive_journal' -c 'CREATE DATABASE timekeeper_calendars'
          ./mvnw -B -ntp -f server/pom.xml test -Dtest=PostgresSchemaIT,EmailRecoveryStoreTest,PasskeyStoreTest,PasskeyCredentialsTest,PasskeyCeremoniesTest,ServiceSettingsTest,AccountArchiveTest,AccountArchiveImportTest,AccountArchiveHttpTest,AccountUploadsTest,CalendarHttpTest,JournalImportTest,JournalDevicesTest,JournalSynchronizationTest,JournalAccountSecurityTest,JournalReconciliationTest -Dsurefire.failIfNoSpecifiedTests=false
          docker rm -f timekeeper-pg-test
      - name: Verify HTTP contracts, rolling updates, backups and durable restart
        run: |
          python -m pip install -r common/api/tests/requirements.txt
          python server/scripts/compose_acceptance.py
      - name: Verify email recovery across actual replicas and hostname cutover
        run: python server/scripts/email_replica_acceptance.py --server-image timekeeper-server:test
      - name: Verify signed passkeys across replicas, revocation and origin migration
        run: python server/scripts/passkey_replica_acceptance.py --server-image timekeeper-server:test --expected-commit "$GITHUB_SHA"
      - name: Verify private account archives across replicas and protected restore
        run: python server/scripts/archive_replica_acceptance.py --server-image timekeeper-server:test --expected-commit "$GITHUB_SHA"
      - name: Verify schema upgrades during protected backup restore
        run: python server/scripts/schema_restore_acceptance.py
      - name: Verify import and Undo across replicas, restart and protected restore
        run: python server/scripts/toggl_replica_acceptance.py --server-image timekeeper-server:test
      - name: Upload container test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: server-compose-test-results
          path: |
            server/**/target/surefire-reports/
            server/target/compose-acceptance/
            server/target/toggl-replica-acceptance.json
            server/target/toggl-replica-acceptance.failure.log
            server/target/passkey-replica-acceptance.json
            server/target/archive-replica-acceptance.json

  verify-synology:
    name: Synology candidate and PostgreSQL 17
    needs: prepare
    concurrency:
      group: containers-pg17-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/**/pom.xml
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: server-compose
          path: server/target/synology-input
      - name: Load the shared image for PostgreSQL 17 validation
        run: |
          (cd server/target/synology-input && sha256sum -c checksums.sha256)
          docker load -i server/target/synology-input/timekeeper-images-linux-amd64.tar.gz
          docker tag "timekeeper-server:sha-$GITHUB_SHA" "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA"
      - name: Verify unprivileged package controls and native database provisioning
        run: |
          go test -C server/synology/installer ./...
          go vet -C server/synology/installer ./...
          python server/synology/tests/acceptance.py
          python server/synology/tests/schema_upgrade_acceptance.py
          python server/scripts/schema_restore_acceptance.py --postgres-image postgres:17.11-bookworm
          python server/synology/tests/migration_acceptance.py --source-schema 2
          python server/synology/tests/migration_acceptance.py --source-schema 3
          python server/synology/tests/migration_acceptance.py --source-schema 4
          python server/synology/tests/migration_acceptance.py --source-schema 5
          python server/synology/tests/migration_acceptance.py
          python server/synology/tests/migration_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA"
      - name: Verify PostgreSQL 17 schema and concurrent bootstrap
        env:
          TIMEKEEPER_TEST_PG_URL: jdbc:postgresql://127.0.0.1:55433/postgres
          TIMEKEEPER_TEST_RECOVERY_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_recovery
          TIMEKEEPER_TEST_PASSKEY_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_passkeys
          TIMEKEEPER_TEST_CALENDAR_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_calendars
          TIMEKEEPER_TEST_SETTINGS_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_settings
          TIMEKEEPER_TEST_ARCHIVE_DB_URL: jdbc:postgresql://127.0.0.1:55433/timekeeper_archive
          TIMEKEEPER_TEST_PG_USER: postgres
          TIMEKEEPER_TEST_PG_PASSWORD: isolated-ci-test
        run: |
          docker run -d --name timekeeper-pg17-test -e POSTGRES_PASSWORD=isolated-ci-test -p 127.0.0.1:55433:5432 postgres:17.11-bookworm
          for attempt in $(seq 1 60); do
            if docker exec timekeeper-pg17-test pg_isready -h 127.0.0.1 -U postgres; then break; fi
            echo "Waiting for isolated PostgreSQL 17 (attempt $attempt)"
            sleep 1
          done
          docker exec timekeeper-pg17-test psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE timekeeper_recovery' -c 'CREATE DATABASE timekeeper_passkeys' -c 'CREATE DATABASE timekeeper_settings' -c 'CREATE DATABASE timekeeper_archive_export' -c 'CREATE DATABASE timekeeper_archive_import' -c 'CREATE DATABASE timekeeper_archive_http' -c 'CREATE DATABASE timekeeper_archive_upload' -c 'CREATE DATABASE timekeeper_archive_journal' -c 'CREATE DATABASE timekeeper_calendars'
          ./mvnw -B -ntp -f server/pom.xml test -Dtest=PostgresSchemaIT,EmailRecoveryStoreTest,PasskeyStoreTest,PasskeyCredentialsTest,PasskeyCeremoniesTest,ServiceSettingsTest,AccountArchiveTest,AccountArchiveImportTest,AccountArchiveHttpTest,AccountUploadsTest,CalendarHttpTest,JournalImportTest,JournalDevicesTest,JournalSynchronizationTest,JournalAccountSecurityTest,JournalReconciliationTest -Dsurefire.failIfNoSpecifiedTests=false
          docker rm -f -v timekeeper-pg17-test
      - name: Verify real API, backup, recovery and rolling updates with PostgreSQL 17
        run: |
          python -m pip install -r common/api/tests/requirements.txt
          python server/scripts/compose_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/synology-acceptance
      - name: Verify import and Undo with PostgreSQL 17
        run: python server/scripts/toggl_replica_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/toggl-pg17-acceptance.json
      - name: Verify signed passkeys and hostname migration with PostgreSQL 17
        run: python server/scripts/passkey_replica_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --expected-commit "$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/passkey-pg17-acceptance.json
      - name: Verify private account archives with PostgreSQL 17
        run: python server/scripts/archive_replica_acceptance.py --server-image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --expected-commit "$GITHUB_SHA" --postgres-image postgres:17.11-bookworm --output server/target/archive-pg17-acceptance.json
      - name: Build and validate the self-contained preview package
        run: python server/scripts/package_synology.py --commit "$GITHUB_SHA" --image "ghcr.io/turesheim/eclipse-timekeeper-server:sha-$GITHUB_SHA" --revision "$GITHUB_RUN_NUMBER" --output server/target/synology
      - name: Generate preview discovery metadata for NAS acceptance
        run: |
          python server/scripts/synology_catalog.py --package "server/target/synology/timekeeper-1.99.0-$GITHUB_RUN_NUMBER-r1000.spk" --base-url "https://turesheim.github.io/eclipse-timekeeper/synology/preview/r1000/"
          python server/scripts/promote_synology.py --package "server/target/synology/timekeeper-1.99.0-$GITHUB_RUN_NUMBER-r1000.spk" --write-template server/target/synology/dsm-acceptance-template.json
      - name: Upload Synology installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: synology-installer
          if-no-files-found: error
          path: |
            server/target/synology/*.spk
            server/target/synology/*.spk.sha256
            server/target/synology/*.json
            server/target/synology/*.png
      - name: Upload Synology test results
        uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: synology-test-results
          path: |
            server/target/synology-acceptance/
            server/target/toggl-pg17-acceptance.json
            server/target/toggl-pg17-acceptance.failure.log
            server/target/passkey-pg17-acceptance.json
            server/target/archive-pg17-acceptance.json
            server/**/target/surefire-reports/

  publish:
    needs: [prepare, verify, verify-synology]
    if: github.event_name != 'pull_request'
    concurrency:
      group: containers-publish-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: eclipse-timekeeper-server
            dockerfile: server/Dockerfile
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TIMEKEEPER_BUILD_COMMIT=${{ github.sha }}
            TIMEKEEPER_BUILD_DIRTY=false
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
