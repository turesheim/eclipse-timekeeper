global
  log stdout format raw local0
  maxconn 512
  # Percent-encoded provider identities can require a 128 KiB request line.
  tune.bufsize 262144

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend http
  bind :8080
  mode http
  acl database_health path -i /q/health/database
  use_backend postgres-readiness if database_health
  default_backend api

backend postgres-readiness
  mode http
  http-request set-path /primary
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 2s fall 2 rise 1 init-state fully-down
  server postgres-1 postgres-1:8008 check resolvers docker init-addr libc,none
  server postgres-2 postgres-2:8008 check resolvers docker init-addr libc,none
  server postgres-3 postgres-3:8008 check resolvers docker init-addr libc,none

backend api
  mode http
  balance roundrobin
  option httpchk GET /q/health/ready
  http-check expect status 200
  # Retry connections only. Mutating HTTP requests are never replayed by the proxy.
  retries 2
  retry-on conn-failure
  option redispatch
  default-server init-state fully-down
  server api-1 api-1:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server api-2 api-2:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

frontend postgres
  bind :5432
  mode tcp
  default_backend postgres-primary

backend postgres-primary
  mode tcp
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 2s fall 2 rise 1 init-state fully-down on-marked-down shutdown-sessions
  server postgres-1 postgres-1:5432 check port 8008 resolvers docker init-addr libc,none
  server postgres-2 postgres-2:5432 check port 8008 resolvers docker init-addr libc,none
  server postgres-3 postgres-3:5432 check port 8008 resolvers docker init-addr libc,none
