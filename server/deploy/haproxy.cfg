global
  log stdout format raw local0
  maxconn 512
  # Percent-encoded provider identities can require a 128 KiB request line.
  tune.bufsize 262144
  # Administrative socket is reachable only inside this container.
  stats socket ipv4@127.0.0.1:9999 level admin

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend http
  bind :8080
  mode http
  default_backend api

backend api
  mode http
  balance roundrobin
  option httpchk GET /q/health/ready
  http-check expect status 200
  # Retry connections only. Mutating HTTP requests are never replayed by the proxy.
  retries 2
  retry-on conn-failure
  option redispatch
  default-server init-state fully-down
  server api-1 api-1:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server api-2 api-2:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
