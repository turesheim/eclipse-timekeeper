global
  log stdout format raw local0
  maxconn 512
  # Percent-encoded provider identities can require a 128 KiB request line.
  tune.bufsize 262144
  # Administrative socket is reachable only inside this container.
  stats socket ipv4@127.0.0.1:9999 level admin

defaults
  log global
  timeout connect 5s
  timeout client 60s
  timeout server 60s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend http
  bind :8080
  mode http
  default_backend api

backend api
  mode http
  # Preparing a private disk-backed ZIP can take longer than ordinary API work.
  http-request set-timeout server 30m if { method GET } { path -m str /api/v1/data/account/export /api/v1/notes/export }
  balance roundrobin
  option httpchk
  http-check send meth GET uri /q/health/ready ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  # Retry connections only. Mutating HTTP requests are never replayed by the proxy.
  retries 2
  retry-on conn-failure
  option redispatch
  default-server init-state fully-down
  server api-1 api-1:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none
  server api-2 api-2:8080 check inter 2s fall 2 rise 2 resolvers docker init-addr libc,none

# Published only by the draw.io Compose override. A separate frontend keeps
# editor traffic on the static listener, even when a request uses an API path.
frontend drawio
  bind :8082
  mode http
  default_backend drawio_assets

backend drawio_assets
  mode http
  option httpchk GET /
  http-check expect status 200
  server editor-1 api-1:8082 check inter 2s resolvers docker init-addr libc,none
  server editor-2 api-2:8082 check inter 2s resolvers docker init-addr libc,none backup
