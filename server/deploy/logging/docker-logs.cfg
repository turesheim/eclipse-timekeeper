# Only Alloy shares this private network. Docker's socket itself is privileged.
global
    maxconn 128

defaults
    mode http
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    timeout http-request 5s

frontend discovery_and_logs
    bind :2375
    acl read_method method GET HEAD
    acl list_or_ping path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|containers/json|networks)$
    acl container_read path_reg ^(/v[0-9]+\.[0-9]+)?/containers/[0-9a-f]{64}/(json|logs)$
    http-request deny unless read_method list_or_ping or read_method container_read
    default_backend docker

backend docker
    server engine /var/run/docker.sock
