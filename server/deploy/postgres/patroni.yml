scope: timekeeper
namespace: /timekeeper/
restapi:
  listen: 0.0.0.0:8008
  authentication:
    username: patroni
etcd3:
  hosts: etcd-1:2379,etcd-2:2379,etcd-3:2379
bootstrap:
  dcs:
    ttl: 30
    loop_wait: 5
    retry_timeout: 5
    check_timeline: true
    synchronous_mode: true
    synchronous_mode_strict: true
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: 'on'
        max_wal_senders: 10
        max_replication_slots: 10
        max_connections: 100
        shared_buffers: 128MB
        password_encryption: scram-sha-256
        synchronous_commit: 'on'
        wal_keep_size: 256MB
        max_slot_wal_keep_size: 2GB
  initdb:
    - encoding: UTF8
    - data-checksums
  post_bootstrap: /usr/local/bin/timekeeper-bootstrap
postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/data
  bin_dir: /usr/lib/postgresql/18/bin
  pgpass: /var/lib/postgresql/.pgpass
  basebackup:
    checkpoint: fast
  authentication:
    superuser:
      username: postgres
    replication:
      username: replicator
  pg_hba:
    - local all all trust
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256
  parameters:
    unix_socket_directories: /var/run/postgresql
watchdog:
  mode: 'off'
