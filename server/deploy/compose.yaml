name: timekeeper

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-api: &api
  image: ${TIMEKEEPER_SERVER_IMAGE:-ghcr.io/turesheim/eclipse-timekeeper-server:edge}
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [application, database]
  logging: *logging
  environment:
    TIMEKEEPER_SERVER_DB_URL: jdbc:postgresql://postgres:5432/timekeeper
    TIMEKEEPER_SERVER_DB_USER: timekeeper
    TIMEKEEPER_SERVER_DB_PASSWORD_FILE: /run/secrets/timekeeper_database_password
    TIMEKEEPER_SERVER_TOKENS_FILE: /config/tokens.json
    TIMEKEEPER_SERVER_SETUP_FILE: ${TIMEKEEPER_SERVER_SETUP_FILE:-NONE}
    TIMEKEEPER_PUBLIC_ORIGIN: ${TIMEKEEPER_PUBLIC_ORIGIN:-NONE}
    QUARKUS_DATASOURCE_JDBC_MAX_SIZE: '16'
    QUARKUS_SHUTDOWN_TIMEOUT: 20s
    JAVA_OPTS: -Xms64m -Xmx384m
    TIMEKEEPER_DEPLOYED_AT: ${TIMEKEEPER_DEPLOYED_AT:-}
  secrets: [timekeeper_database_password]
  volumes:
    - ${TIMEKEEPER_STATE_DIR:-./state}/config:/config:ro
  depends_on:
    postgres: {condition: service_healthy}

services:
  postgres:
    image: ${TIMEKEEPER_POSTGRES_IMAGE:-postgres:18.6-bookworm}
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    networks: [database]
    logging: *logging
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets: [postgres_admin_password, timekeeper_database_password]
    volumes:
      - ${TIMEKEEPER_STATE_DIR:-./state}/postgres:/var/lib/postgresql
      - ./postgres/bootstrap.sql:/docker-entrypoint-initdb.d/10-timekeeper.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$(cat /run/secrets/timekeeper_database_password)" psql -h 127.0.0.1 -U timekeeper -d timekeeper --no-password -tAc "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5
  api-1: {<<: *api, hostname: api-1}
  api-2: {<<: *api, hostname: api-2}
  gateway:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    networks: [application]
    logging: *logging
    ports: ["${TIMEKEEPER_BIND_ADDRESS:-127.0.0.1}:${TIMEKEEPER_HTTP_PORT:-8080}:8080"]
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/q/health/ready]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      api-1: {condition: service_healthy}
      api-2: {condition: service_healthy}
  maintenance:
    image: ${TIMEKEEPER_POSTGRES_IMAGE:-postgres:18.6-bookworm}
    profiles: [tools]
    networks: [database]
    secrets: [timekeeper_database_password]
    logging: *logging

networks:
  application: {}
  database: {internal: true}

secrets:
  postgres_admin_password:
    file: ${TIMEKEEPER_STATE_DIR:-./state}/secrets/postgres_admin_password
  timekeeper_database_password:
    file: ${TIMEKEEPER_STATE_DIR:-./state}/secrets/timekeeper_database_password
