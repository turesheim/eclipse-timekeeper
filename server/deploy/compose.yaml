name: timekeeper

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-api: &api
  image: ${DAGSVERK_SERVER_IMAGE-${TIMEKEEPER_SERVER_IMAGE:-ghcr.io/turesheim/eclipse-timekeeper-server:edge}}
  restart: unless-stopped
  stop_grace_period: 30s
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [application, database]
  logging: *logging
  # Identical legacy aliases keep automatic rollback to older 2.x images usable.
  environment:
    DAGSVERK_SERVER_DB_URL: &dagsverk-server-db-url jdbc:postgresql://postgres:5432/timekeeper
    TIMEKEEPER_SERVER_DB_URL: *dagsverk-server-db-url
    DAGSVERK_SERVER_DB_USER: &dagsverk-server-db-user timekeeper
    TIMEKEEPER_SERVER_DB_USER: *dagsverk-server-db-user
    DAGSVERK_SERVER_DB_PASSWORD_FILE: &dagsverk-server-db-password-file /run/secrets/timekeeper_database_password
    TIMEKEEPER_SERVER_DB_PASSWORD_FILE: *dagsverk-server-db-password-file
    DAGSVERK_SERVER_TOKENS_FILE: &dagsverk-server-tokens-file /config/tokens.json
    TIMEKEEPER_SERVER_TOKENS_FILE: *dagsverk-server-tokens-file
    DAGSVERK_INSTANCE_BACKUP_STORAGE: &dagsverk-instance-backup-storage /instance/backups
    TIMEKEEPER_INSTANCE_BACKUP_STORAGE: *dagsverk-instance-backup-storage
    DAGSVERK_INSTANCE_RESTORE_STORAGE: &dagsverk-instance-restore-storage /instance/restore
    TIMEKEEPER_INSTANCE_RESTORE_STORAGE: *dagsverk-instance-restore-storage
    DAGSVERK_MAINTENANCE_FILE: &dagsverk-maintenance-file /instance/maintenance.pending
    TIMEKEEPER_MAINTENANCE_FILE: *dagsverk-maintenance-file
    DAGSVERK_ALLOW_SCHEMA_UPGRADE: &dagsverk-allow-schema-upgrade ${DAGSVERK_ALLOW_SCHEMA_UPGRADE-${TIMEKEEPER_ALLOW_SCHEMA_UPGRADE:-false}}
    TIMEKEEPER_ALLOW_SCHEMA_UPGRADE: *dagsverk-allow-schema-upgrade
    DAGSVERK_SERVER_SETUP_FILE: &dagsverk-server-setup-file ${DAGSVERK_SERVER_SETUP_FILE-${TIMEKEEPER_SERVER_SETUP_FILE:-NONE}}
    TIMEKEEPER_SERVER_SETUP_FILE: *dagsverk-server-setup-file
    DAGSVERK_PACKAGE_ID: &dagsverk-package-id ${DAGSVERK_PACKAGE_ID-${TIMEKEEPER_PACKAGE_ID:-timekeeper}}
    TIMEKEEPER_PACKAGE_ID: *dagsverk-package-id
    DAGSVERK_CONNECT_SHARED: &dagsverk-connect-shared ${DAGSVERK_CONNECT_SHARED-${TIMEKEEPER_CONNECT_SHARED:-true}}
    TIMEKEEPER_CONNECT_SHARED: *dagsverk-connect-shared
    DAGSVERK_CONNECT_SERVICE_URL: &dagsverk-connect-service-url ${DAGSVERK_CONNECT_SERVICE_URL-${TIMEKEEPER_CONNECT_SERVICE_URL:-}}
    TIMEKEEPER_CONNECT_SERVICE_URL: *dagsverk-connect-service-url
    DAGSVERK_PUBLIC_ORIGIN: &dagsverk-public-origin ${DAGSVERK_PUBLIC_ORIGIN-${TIMEKEEPER_PUBLIC_ORIGIN:-NONE}}
    TIMEKEEPER_PUBLIC_ORIGIN: *dagsverk-public-origin
    DAGSVERK_SETTINGS_RECOVERY: &dagsverk-settings-recovery ${DAGSVERK_SETTINGS_RECOVERY-${TIMEKEEPER_SETTINGS_RECOVERY:-false}}
    TIMEKEEPER_SETTINGS_RECOVERY: *dagsverk-settings-recovery
    DAGSVERK_AUTH_ORIGIN_EPOCH: &dagsverk-auth-origin-epoch ${DAGSVERK_AUTH_ORIGIN_EPOCH-${TIMEKEEPER_AUTH_ORIGIN_EPOCH:-1}}
    TIMEKEEPER_AUTH_ORIGIN_EPOCH: *dagsverk-auth-origin-epoch
    DAGSVERK_PASSKEYS_ENABLED: &dagsverk-passkeys-enabled ${DAGSVERK_PASSKEYS_ENABLED-${TIMEKEEPER_PASSKEYS_ENABLED:-true}}
    TIMEKEEPER_PASSKEYS_ENABLED: *dagsverk-passkeys-enabled
    DAGSVERK_PASSKEY_RP_ID: &dagsverk-passkey-rp-id ${DAGSVERK_PASSKEY_RP_ID-${TIMEKEEPER_PASSKEY_RP_ID:-AUTO}}
    TIMEKEEPER_PASSKEY_RP_ID: *dagsverk-passkey-rp-id
    DAGSVERK_CALENDAR_TRUSTED_ORIGINS: &dagsverk-calendar-trusted-origins ${DAGSVERK_CALENDAR_TRUSTED_ORIGINS-${TIMEKEEPER_CALENDAR_TRUSTED_ORIGINS:-}}
    TIMEKEEPER_CALENDAR_TRUSTED_ORIGINS: *dagsverk-calendar-trusted-origins
    DAGSVERK_CALENDAR_AUTOMATIC: &dagsverk-calendar-automatic ${DAGSVERK_CALENDAR_AUTOMATIC-${TIMEKEEPER_CALENDAR_AUTOMATIC:-true}}
    TIMEKEEPER_CALENDAR_AUTOMATIC: *dagsverk-calendar-automatic
    QUARKUS_CONFIG_LOCATIONS: file:/config/mail.properties,file:/run/task-providers/application.properties
    DAGSVERK_SMTP_PASSWORD_FILE: &dagsverk-smtp-password-file /run/secrets/timekeeper_smtp_password
    TIMEKEEPER_SMTP_PASSWORD_FILE: *dagsverk-smtp-password-file
    QUARKUS_DATASOURCE_JDBC_MAX_SIZE: '16'
    QUARKUS_SHUTDOWN_TIMEOUT: 20s
    JAVA_OPTS: -Xms64m -Xmx384m
    DAGSVERK_DEPLOYED_AT: &dagsverk-deployed-at ${DAGSVERK_DEPLOYED_AT-${TIMEKEEPER_DEPLOYED_AT:-}}
    TIMEKEEPER_DEPLOYED_AT: *dagsverk-deployed-at
  secrets: [timekeeper_database_password, timekeeper_smtp_password]
  volumes:
    - ${DAGSVERK_STATE_DIR-${TIMEKEEPER_STATE_DIR:-./state}}/config:/config:ro
    - ${DAGSVERK_STATE_DIR-${TIMEKEEPER_STATE_DIR:-./state}}/secrets/task-providers:/run/task-providers:ro
    - instance-state:/instance
  depends_on:
    postgres: {condition: service_healthy}

services:
  postgres:
    image: ${DAGSVERK_POSTGRES_IMAGE-${TIMEKEEPER_POSTGRES_IMAGE:-postgres:18.6-bookworm}}
    restart: unless-stopped
    stop_grace_period: 60s
    shm_size: 256mb
    networks: [database]
    logging: *logging
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets: [postgres_admin_password, timekeeper_database_password]
    volumes:
      - ${DAGSVERK_STATE_DIR-${TIMEKEEPER_STATE_DIR:-./state}}/postgres:/var/lib/postgresql
      - ./postgres/bootstrap.sql:/docker-entrypoint-initdb.d/10-timekeeper.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'PGPASSWORD="$$(cat /run/secrets/timekeeper_database_password)" psql -h 127.0.0.1 -U timekeeper -d timekeeper --no-password -tAc "SELECT 1" > /dev/null']
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 5
  api-1: {<<: *api, hostname: api-1}
  api-2: {<<: *api, hostname: api-2}
  gateway:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    networks: [application]
    logging: *logging
    ports: ["${DAGSVERK_BIND_ADDRESS-${TIMEKEEPER_BIND_ADDRESS:-127.0.0.1}}:${DAGSVERK_HTTP_PORT-${TIMEKEEPER_HTTP_PORT:-8080}}:8080"]
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/q/health/ready]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      api-1: {condition: service_healthy}
      api-2: {condition: service_healthy}
  maintenance:
    image: ${DAGSVERK_POSTGRES_IMAGE-${TIMEKEEPER_POSTGRES_IMAGE:-postgres:18.6-bookworm}}
    profiles: [tools]
    networks: [database]
    secrets: [timekeeper_database_password]
    volumes: [instance-state:/instance]
    logging: *logging

volumes:
  instance-state: {}

networks:
  application: {}
  database: {internal: true}

secrets:
  postgres_admin_password:
    file: ${DAGSVERK_STATE_DIR-${TIMEKEEPER_STATE_DIR:-./state}}/secrets/postgres_admin_password
  timekeeper_database_password:
    file: ${DAGSVERK_STATE_DIR-${TIMEKEEPER_STATE_DIR:-./state}}/secrets/timekeeper_database_password
  timekeeper_smtp_password:
    file: ${DAGSVERK_STATE_DIR-${TIMEKEEPER_STATE_DIR:-./state}}/secrets/timekeeper_smtp_password
