services:
  connect:
    image: dagsverk-connect:review
    env_file: service.env
    environment:
      QUARKUS_HTTP_HOST: 0.0.0.0
      TIMEKEEPER_CONNECT_DB_URL: jdbc:postgresql://database:5432/connect
      TIMEKEEPER_CONNECT_DB_USER: connect
      TIMEKEEPER_CONNECT_DB_PASSWORD: ${CONNECT_DATABASE_PASSWORD:?Set CONNECT_DATABASE_PASSWORD in the private Compose environment}
    ports:
      - 127.0.0.1:8090:8090
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: connect
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: ${CONNECT_DATABASE_PASSWORD:?Set CONNECT_DATABASE_PASSWORD in the private Compose environment}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U connect -d connect"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
volumes:
  database:
