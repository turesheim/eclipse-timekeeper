quarkus.http.host=127.0.0.1
quarkus.http.port=8090
quarkus.http.limits.max-body-size=32K
quarkus.http.limits.max-initial-line-length=32768
quarkus.http.access-log.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${DAGSVERK_CONNECT_DB_URL:${TIMEKEEPER_CONNECT_DB_URL}}
quarkus.datasource.username=${DAGSVERK_CONNECT_DB_USER:${TIMEKEEPER_CONNECT_DB_USER:sa}}
quarkus.datasource.password=${DAGSVERK_CONNECT_DB_PASSWORD:${TIMEKEEPER_CONNECT_DB_PASSWORD:}}
quarkus.datasource.devservices.enabled=false
%postgresql.quarkus.datasource.db-kind=postgresql
timekeeper.connect.origin=${DAGSVERK_CONNECT_ORIGIN:${TIMEKEEPER_CONNECT_ORIGIN}}
timekeeper.connect.encryption-key=${DAGSVERK_CONNECT_ENCRYPTION_KEY:${TIMEKEEPER_CONNECT_ENCRYPTION_KEY}}
timekeeper.connect.google.client-id=${DAGSVERK_CONNECT_GOOGLE_CLIENT_ID:${TIMEKEEPER_CONNECT_GOOGLE_CLIENT_ID:}}
timekeeper.connect.google.client-secret=${DAGSVERK_CONNECT_GOOGLE_CLIENT_SECRET:${TIMEKEEPER_CONNECT_GOOGLE_CLIENT_SECRET:}}
timekeeper.connect.microsoft.client-id=${DAGSVERK_CONNECT_MICROSOFT_CLIENT_ID:${TIMEKEEPER_CONNECT_MICROSOFT_CLIENT_ID:}}
timekeeper.connect.microsoft.client-secret=${DAGSVERK_CONNECT_MICROSOFT_CLIENT_SECRET:${TIMEKEEPER_CONNECT_MICROSOFT_CLIENT_SECRET:}}
%test.quarkus.http.test-port=0
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:timekeeper_connect_test;DB_CLOSE_DELAY=-1
%test.timekeeper.connect.origin=https://connect.example.test
%test.timekeeper.connect.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
%test.timekeeper.connect.google.client-id=fixture-google-client
%test.timekeeper.connect.google.client-secret=fixture-google-secret
%test.timekeeper.connect.microsoft.client-id=fixture-microsoft-client
%test.timekeeper.connect.microsoft.client-secret=fixture-microsoft-secret
