quarkus.http.host=127.0.0.1
quarkus.http.port=8090
quarkus.http.limits.max-body-size=32K
quarkus.http.limits.max-initial-line-length=32768
quarkus.http.access-log.enabled=false
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${TIMEKEEPER_CONNECT_DB_URL}
quarkus.datasource.username=${TIMEKEEPER_CONNECT_DB_USER:sa}
quarkus.datasource.password=${TIMEKEEPER_CONNECT_DB_PASSWORD:}
quarkus.datasource.devservices.enabled=false
%postgresql.quarkus.datasource.db-kind=postgresql
timekeeper.connect.origin=${TIMEKEEPER_CONNECT_ORIGIN}
timekeeper.connect.encryption-key=${TIMEKEEPER_CONNECT_ENCRYPTION_KEY}
timekeeper.connect.google.client-id=${TIMEKEEPER_CONNECT_GOOGLE_CLIENT_ID:}
timekeeper.connect.google.client-secret=${TIMEKEEPER_CONNECT_GOOGLE_CLIENT_SECRET:}
timekeeper.connect.microsoft.client-id=${TIMEKEEPER_CONNECT_MICROSOFT_CLIENT_ID:}
timekeeper.connect.microsoft.client-secret=${TIMEKEEPER_CONNECT_MICROSOFT_CLIENT_SECRET:}
%test.quarkus.http.test-port=0
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:timekeeper_connect_test;DB_CLOSE_DELAY=-1
%test.timekeeper.connect.origin=https://connect.example.test
%test.timekeeper.connect.encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
%test.timekeeper.connect.google.client-id=fixture-google-client
%test.timekeeper.connect.google.client-secret=fixture-google-secret
%test.timekeeper.connect.microsoft.client-id=fixture-microsoft-client
%test.timekeeper.connect.microsoft.client-secret=fixture-microsoft-secret
