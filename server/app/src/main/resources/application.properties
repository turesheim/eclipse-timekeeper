quarkus.http.host=127.0.0.1
quarkus.datasource.db-kind=h2
%postgresql.quarkus.datasource.db-kind=postgresql
%postgresql.quarkus.datasource.jdbc.new-connection-sql=SET synchronous_commit TO on
%postgresql.quarkus.datasource.jdbc.validate-on-borrow=true
%test.quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${DAGSVERK_SERVER_DB_URL:${TIMEKEEPER_SERVER_DB_URL}}
quarkus.datasource.username=${DAGSVERK_SERVER_DB_USER:${TIMEKEEPER_SERVER_DB_USER:sa}}
quarkus.datasource.password=${DAGSVERK_SERVER_DB_PASSWORD:${TIMEKEEPER_SERVER_DB_PASSWORD:}}
quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:timekeeper_server_test

timekeeper.auth.tokens-file=${DAGSVERK_SERVER_TOKENS_FILE:${TIMEKEEPER_SERVER_TOKENS_FILE:NONE}}
%test.timekeeper.auth.tokens-file=src/test/resources/test-tokens.json
timekeeper.deployed-at=${DAGSVERK_DEPLOYED_AT:${TIMEKEEPER_DEPLOYED_AT:}}
timekeeper.spk-version=${DAGSVERK_SPK_VERSION:${TIMEKEEPER_SPK_VERSION:}}
timekeeper.package-id=${DAGSVERK_PACKAGE_ID:${TIMEKEEPER_PACKAGE_ID:timekeeper}}
%test.timekeeper.spk-version=1.99.0-146
%test.timekeeper.deployed-at=2026-10-13T08:30:00Z
quarkus.http.limits.max-body-size=200M

quarkus.datasource.jdbc.initial-size=0

# Provider identifiers are percent-encoded in lookup URLs (up to 12 bytes/code point).
quarkus.http.limits.max-initial-line-length=131072

# The bundled web client uses only same-origin, external scripts/styles.
quarkus.http.filter.web.matches=/(web|admin)(/.*)?
quarkus.http.filter.web.header."Content-Security-Policy"=default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
quarkus.http.filter.web.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.web.header."Referrer-Policy"=no-referrer
quarkus.http.filter.web.header."Cache-Control"=no-cache

timekeeper.auth.setup-file=${DAGSVERK_SERVER_SETUP_FILE:${TIMEKEEPER_SERVER_SETUP_FILE:NONE}}
timekeeper.auth.public-origin=${DAGSVERK_PUBLIC_ORIGIN:${TIMEKEEPER_PUBLIC_ORIGIN:NONE}}
timekeeper.auth.origin-epoch=${DAGSVERK_AUTH_ORIGIN_EPOCH:${TIMEKEEPER_AUTH_ORIGIN_EPOCH:1}}
timekeeper.auth.passkeys-enabled=${DAGSVERK_PASSKEYS_ENABLED:${TIMEKEEPER_PASSKEYS_ENABLED:true}}
timekeeper.auth.passkey-rp-id=${DAGSVERK_PASSKEY_RP_ID:${TIMEKEEPER_PASSKEY_RP_ID:AUTO}}
timekeeper.mail.enabled=${DAGSVERK_MAIL_ENABLED:${TIMEKEEPER_MAIL_ENABLED:false}}
# Never use the mailer's mock mode: it prints message bodies (including recovery links).
quarkus.mailer.mock=false
quarkus.mailer.host=${DAGSVERK_SMTP_HOST:${TIMEKEEPER_SMTP_HOST:localhost}}
quarkus.mailer.port=${DAGSVERK_SMTP_PORT:${TIMEKEEPER_SMTP_PORT:587}}
quarkus.mailer.from=${DAGSVERK_SMTP_FROM:${TIMEKEEPER_SMTP_FROM:timekeeper@localhost}}
quarkus.mailer.username=${DAGSVERK_SMTP_USERNAME:${TIMEKEEPER_SMTP_USERNAME:}}
quarkus.mailer.password=${DAGSVERK_SMTP_PASSWORD:${TIMEKEEPER_SMTP_PASSWORD:}}
quarkus.mailer.tls=${DAGSVERK_SMTP_TLS:${TIMEKEEPER_SMTP_TLS:false}}
quarkus.mailer.start-tls=${DAGSVERK_SMTP_START_TLS:${TIMEKEEPER_SMTP_START_TLS:REQUIRED}}

timekeeper.schema.allow-upgrade=${DAGSVERK_ALLOW_SCHEMA_UPGRADE:${TIMEKEEPER_ALLOW_SCHEMA_UPGRADE:false}}

# Explicit offline operator recovery only; normal restarts preserve central settings.
timekeeper.service-settings.recover=${DAGSVERK_SETTINGS_RECOVERY:${TIMEKEEPER_SETTINGS_RECOVERY:false}}

# Public HTTPS feeds by default. Exact operator-approved origins may access an
# internal calendar server; no browser/API credentials are forwarded.
timekeeper.calendars.trusted-origins=${DAGSVERK_CALENDAR_TRUSTED_ORIGINS:${TIMEKEEPER_CALENDAR_TRUSTED_ORIGINS:}}
timekeeper.calendars.automatic=${DAGSVERK_CALENDAR_AUTOMATIC:${TIMEKEEPER_CALENDAR_AUTOMATIC:true}}
%test.timekeeper.calendars.automatic=false
timekeeper.tasks.automatic=${DAGSVERK_TASK_AUTOMATIC:${TIMEKEEPER_TASK_AUTOMATIC:true}}
%test.timekeeper.tasks.automatic=false
timekeeper.notes.tasks.automatic=${DAGSVERK_NOTE_TASKS_AUTOMATIC:${TIMEKEEPER_NOTE_TASKS_AUTOMATIC:true}}
%test.timekeeper.notes.tasks.automatic=false
timekeeper.tasks.google.client-id=${DAGSVERK_GOOGLE_TASKS_CLIENT_ID:${TIMEKEEPER_GOOGLE_TASKS_CLIENT_ID:}}
timekeeper.tasks.google.client-secret=${DAGSVERK_GOOGLE_TASKS_CLIENT_SECRET:${TIMEKEEPER_GOOGLE_TASKS_CLIENT_SECRET:}}
timekeeper.tasks.microsoft.client-id=${DAGSVERK_MICROSOFT_TASKS_CLIENT_ID:${TIMEKEEPER_MICROSOFT_TASKS_CLIENT_ID:}}
timekeeper.tasks.microsoft.client-secret=${DAGSVERK_MICROSOFT_TASKS_CLIENT_SECRET:${TIMEKEEPER_MICROSOFT_TASKS_CLIENT_SECRET:}}
timekeeper.connect.shared=${DAGSVERK_CONNECT_SHARED:${TIMEKEEPER_CONNECT_SHARED:true}}
timekeeper.connect.service-url=${DAGSVERK_CONNECT_SERVICE_URL:${TIMEKEEPER_CONNECT_SERVICE_URL:}}
%test.timekeeper.connect.shared=false

# HostPolicy enforces the effective central hostname for every route, plus loopback.
# The framework localhost-only default cannot follow database-backed host changes.
quarkus.http.host-validation.require-localhost=false

# Shared private handoff for coordinated offline restore.
timekeeper.instance-restore.storage=${DAGSVERK_INSTANCE_RESTORE_STORAGE:${TIMEKEEPER_INSTANCE_RESTORE_STORAGE:NONE}}

# Account-private Notes collection deployment limits, included in instance backups.
timekeeper.notes.max-file-bytes=${DAGSVERK_NOTES_MAX_FILE_BYTES:${TIMEKEEPER_NOTES_MAX_FILE_BYTES:160000000}}
timekeeper.notes.max-markdown-bytes=${DAGSVERK_NOTES_MAX_MARKDOWN_BYTES:${TIMEKEEPER_NOTES_MAX_MARKDOWN_BYTES:10000000}}
timekeeper.notes.max-total-bytes=${DAGSVERK_NOTES_MAX_TOTAL_BYTES:${TIMEKEEPER_NOTES_MAX_TOTAL_BYTES:5000000000}}
timekeeper.notes.max-entries=${DAGSVERK_NOTES_MAX_ENTRIES:${TIMEKEEPER_NOTES_MAX_ENTRIES:100000}}
timekeeper.notes.max-page-size=${DAGSVERK_NOTES_MAX_PAGE_SIZE:${TIMEKEEPER_NOTES_MAX_PAGE_SIZE:200}}

# Replica-local derived Notes search data; never share a writable cache root.
timekeeper.notes.search.cache-directory=${DAGSVERK_NOTES_SEARCH_CACHE_DIRECTORY:${TIMEKEEPER_NOTES_SEARCH_CACHE_DIRECTORY:AUTO}}
timekeeper.notes.search.open-owners=${DAGSVERK_NOTES_SEARCH_OPEN_OWNERS:${TIMEKEEPER_NOTES_SEARCH_OPEN_OWNERS:8}}
timekeeper.notes.search.max-cache-bytes=${DAGSVERK_NOTES_SEARCH_MAX_CACHE_BYTES:${TIMEKEEPER_NOTES_SEARCH_MAX_CACHE_BYTES:16000000000}}
timekeeper.notes.search.min-free-bytes=${DAGSVERK_NOTES_SEARCH_MIN_FREE_BYTES:${TIMEKEEPER_NOTES_SEARCH_MIN_FREE_BYTES:1073741824}}
