quarkus.http.host=127.0.0.1
quarkus.datasource.db-kind=h2
%postgresql.quarkus.datasource.db-kind=postgresql
%postgresql.quarkus.datasource.jdbc.new-connection-sql=SET synchronous_commit TO on
%postgresql.quarkus.datasource.jdbc.validate-on-borrow=true
%test.quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=${TIMEKEEPER_SERVER_DB_URL}
quarkus.datasource.username=${TIMEKEEPER_SERVER_DB_USER:sa}
quarkus.datasource.password=${TIMEKEEPER_SERVER_DB_PASSWORD:}
quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:timekeeper_server_test

timekeeper.auth.tokens-file=${TIMEKEEPER_SERVER_TOKENS_FILE:NONE}
timekeeper.journal.configuration-file=${TIMEKEEPER_JOURNAL_CONFIGURATION_FILE:NONE}
%test.timekeeper.auth.tokens-file=src/test/resources/test-tokens.json
timekeeper.deployed-at=${TIMEKEEPER_DEPLOYED_AT:}
timekeeper.spk-version=${TIMEKEEPER_SPK_VERSION:}
%test.timekeeper.spk-version=1.99.0-146
%test.timekeeper.deployed-at=2026-10-13T08:30:00Z
quarkus.http.limits.max-body-size=20M

quarkus.datasource.jdbc.initial-size=0

# Provider identifiers are percent-encoded in lookup URLs (up to 12 bytes/code point).
quarkus.http.limits.max-initial-line-length=131072

# The bundled web client uses only same-origin, external scripts/styles.
quarkus.http.filter.web.matches=/(web|admin)(/.*)?
quarkus.http.filter.web.header."Content-Security-Policy"=default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'
quarkus.http.filter.web.header."X-Content-Type-Options"=nosniff
quarkus.http.filter.web.header."Referrer-Policy"=no-referrer
quarkus.http.filter.web.header."Cache-Control"=no-cache

timekeeper.auth.setup-file=${TIMEKEEPER_SERVER_SETUP_FILE:NONE}
timekeeper.auth.public-origin=${TIMEKEEPER_PUBLIC_ORIGIN:NONE}
timekeeper.auth.origin-epoch=${TIMEKEEPER_AUTH_ORIGIN_EPOCH:1}
timekeeper.auth.passkeys-enabled=${TIMEKEEPER_PASSKEYS_ENABLED:true}
timekeeper.auth.passkey-rp-id=${TIMEKEEPER_PASSKEY_RP_ID:AUTO}
timekeeper.mail.enabled=${TIMEKEEPER_MAIL_ENABLED:false}
# Never use the mailer's mock mode: it prints message bodies (including recovery links).
quarkus.mailer.mock=false
quarkus.mailer.host=${TIMEKEEPER_SMTP_HOST:localhost}
quarkus.mailer.port=${TIMEKEEPER_SMTP_PORT:587}
quarkus.mailer.from=${TIMEKEEPER_SMTP_FROM:timekeeper@localhost}
quarkus.mailer.username=${TIMEKEEPER_SMTP_USERNAME:}
quarkus.mailer.password=${TIMEKEEPER_SMTP_PASSWORD:}
quarkus.mailer.tls=${TIMEKEEPER_SMTP_TLS:false}
quarkus.mailer.start-tls=${TIMEKEEPER_SMTP_START_TLS:REQUIRED}

timekeeper.schema.allow-upgrade=${TIMEKEEPER_ALLOW_SCHEMA_UPGRADE:false}

# Explicit offline operator recovery only; normal restarts preserve central settings.
timekeeper.service-settings.recover=${TIMEKEEPER_SETTINGS_RECOVERY:false}

# Public HTTPS feeds by default. Exact operator-approved origins may access an
# internal calendar server; no browser/API credentials are forwarded.
timekeeper.calendars.trusted-origins=${TIMEKEEPER_CALENDAR_TRUSTED_ORIGINS:}
timekeeper.calendars.automatic=${TIMEKEEPER_CALENDAR_AUTOMATIC:true}
%test.timekeeper.calendars.automatic=false

# HostPolicy enforces the effective central hostname for every route, plus loopback.
# The framework localhost-only default cannot follow database-backed host changes.
quarkus.http.host-validation.require-localhost=false
